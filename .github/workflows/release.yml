name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Validate TypeScript Code
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Application to Android Assets
        run: npx cap sync android

      - name: Generate Android Release Keystore
        run: |
          cd android/app
          if [ ! -f "release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias musamobile \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass musamobile \
              -keypass musamobile \
              -dname "CN=Musa Mobile, OU=Lab, O=Musa Mobile, L=Muzaffargarh, S=Punjab, C=PK"
          fi

      - name: Build Genuine Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify & Validate Genuine Android APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file was generated by Gradle build!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "Generated APK: $APK_FILE"
          echo "File size: $FILE_SIZE bytes ($((FILE_SIZE / 1024 / 1024)) MB)"
          
          # Minimum size validation: Real Capacitor APKs with web assets are always > 2 MB
          if [ "$FILE_SIZE" -lt 1500000 ]; then
            echo "Error: APK file size ($FILE_SIZE bytes) is suspiciously small. Real APK must contain compiled dex and assets!"
            exit 1
          fi
          
          # Validate APK structure has compiled AndroidManifest and classes.dex
          echo "Verifying internal APK contents..."
          unzip -l "$APK_FILE" | grep -E 'AndroidManifest\.xml|classes\.dex|resources\.arsc|assets/public/index\.html'
          
          mkdir -p release-artifacts
          cp "$APK_FILE" release-artifacts/Musa-Mobile-Repairing-v2.0-Signed.apk
          cp "$APK_FILE" release-artifacts/musa-mobile.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musa-Mobile-Release-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Publish GitHub Release with Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release_tag || 'v2.0.0') }}
          name: Musa Mobile Repairing Center ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release_tag || 'v2.0.0') }}
          body: |
            ## 📱 Musa Mobile Repairing Center — Official Native Android APK Release
            موسی موبائل ریپیئرنگ سنٹر - مکمل اینڈرائیڈ ایپلی کیشن (Signed Release APK)

            ### 🚀 Direct Installation on Android:
            - **Musa-Mobile-Repairing-v2.0-Signed.apk**: Genuine compiled native Android APK package (Capacitor Android Runtime with Dalvik/Dex bytecode and compiled resources).
            - **No Parsing Errors**: Fully compiled binary `AndroidManifest.xml`, `classes.dex`, `resources.arsc`, and signed with v1/v2 signatures.
            - **Universal Compatibility**: Minimum Android 7.0 (API 24) to Android 15 (API 36).

            ### ✨ Included Features:
            - **6 Professional Themes**: Including Theme 6 (Premium Pure White Theme), Black & Gold, Royal Blue, Gradient, Dark Neon, and Green Luxury.
            - **Smart Customer Auto Search**: Instant search across Name, Phone, IMEI, and Model.
            - **Job Cards & Repair Progress**: Live percentage indicators and fault checklists.
            - **Thermal Receipts**: 80mm POS receipt generator.
            - **Udhar Khata**: Complete balance and payments tracking.
            - **Camera & Storage Integration**: Take device intake photos and export database backups.
          draft: false
          prerelease: false
          files: |
            release-artifacts/Musa-Mobile-Repairing-v2.0-Signed.apk
            release-artifacts/musa-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
