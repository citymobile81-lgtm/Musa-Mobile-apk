name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v2.0.2)'
        required: false
        default: 'v2.0.2'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Validate TypeScript Code
        run: npm run lint

      - name: Build Web Application
        run: |
          rm -f public/*.apk
          npm run build

      - name: Sync Web Application to Android Assets
        run: |
          npx cap sync android
          rm -f android/app/src/main/assets/public/*.apk

      - name: Verify Permanent Android Release Keystore
        run: |
          cd android/app
          if [ -f "release.keystore" ]; then
            echo "Permanent release.keystore verified!"
          else
            echo "Generating fallback release.keystore..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias musamobile \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass musamobile \
              -keypass musamobile \
              -dname "CN=Musa Mobile, OU=Lab, O=Musa Mobile, L=Muzaffargarh, S=Punjab, C=PK"
          fi

      - name: Build Genuine Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK with apksigner (V1, V2, V3 Schemes) & Verify
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "Error: No APK file was generated by Gradle build!"
            exit 1
          fi
          
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          
          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"
          
          # Align APK if unaligned
          ALIGNED_APK="/tmp/aligned.apk"
          "$ZIPALIGN" -v -p 4 "$RAW_APK" "$ALIGNED_APK" || cp "$RAW_APK" "$ALIGNED_APK"
          
          # Sign using apksigner with V1, V2, V3 enabled
          SIGNED_APK="/tmp/signed.apk"
          "$APKSIGNER" sign \
            --ks android/app/release.keystore \
            --ks-key-alias musamobile \
            --ks-pass pass:musamobile \
            --key-pass pass:musamobile \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          
          echo "Verifying signed APK with apksigner..."
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          
          FILE_SIZE=$(stat -c%s "$SIGNED_APK")
          echo "Signed APK Size: $FILE_SIZE bytes ($((FILE_SIZE / 1024 / 1024)) MB)"
          
          # Validate APK structure has compiled AndroidManifest and classes.dex
          echo "Verifying internal APK contents..."
          unzip -l "$SIGNED_APK" | grep -E 'AndroidManifest\.xml|classes\.dex|resources\.arsc|assets/public/index\.html'
          
          mkdir -p release-artifacts
          cp "$SIGNED_APK" release-artifacts/Musa_Mobile_Repairing_Center.apk
          cp "$SIGNED_APK" release-artifacts/Musa-Mobile-Repairing-v2.0-Signed.apk
          cp "$SIGNED_APK" release-artifacts/musa-mobile.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musa_Mobile_Repairing_Center
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Publish GitHub Release with Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release_tag || 'v2.0.1') }}
          name: Musa Mobile Repairing Center ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release_tag || 'v2.0.1') }}
          body: |
            ## 📱 Musa Mobile Repairing Center — Official Native Android APK Release
            موسی موبائل ریپیئرنگ سنٹر - مکمل اینڈرائیڈ ایپلی کیشن (Signed Release APK)

            ### 🚀 Direct Installation on Android:
            - **Musa_Mobile_Repairing_Center.apk**: Genuine compiled native Android APK package (Capacitor Android Runtime with Dalvik/Dex bytecode and compiled resources).
            - **Musa-Mobile-Repairing-v2.0-Signed.apk**: Alternate signed release asset.
            - **No Parsing Errors**: Fully compiled binary `AndroidManifest.xml`, `classes.dex`, `resources.arsc`, and signed with v1/v2 signatures.
            - **Universal Compatibility**: Minimum Android 7.0 (API 24) to Android 15 (API 36).

            ### ✨ Included Features:
            - **6 Professional Themes**: Including Theme 6 (Premium Pure White Theme), Black & Gold, Royal Blue, Gradient, Dark Neon, and Green Luxury.
            - **Smart Customer Auto Search**: Instant search across Name, Phone, IMEI, and Model.
            - **41 Mobile Accessories**: Interactive Multi-Select Dropdown with live search.
            - **Job Cards & Repair Progress**: Live percentage indicators and fault checklists.
            - **Thermal Receipts**: 80mm POS receipt generator.
            - **Udhar Khata**: Complete balance and payments tracking.
            - **Camera & Storage Integration**: Take device intake photos and export database backups.
          draft: false
          prerelease: false
          files: |
            release-artifacts/Musa_Mobile_Repairing_Center.apk
            release-artifacts/Musa-Mobile-Repairing-v2.0-Signed.apk
            release-artifacts/musa-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
